[package]
name = "idraw"
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/sattamBytes/idraw"
homepage = "https://github.com/sattamBytes/idraw"
readme = "README.md"
keywords = ["diagram", "drawing", "system-design", "macos", "excalidraw"]
categories = ["graphics", "visualization"]
description = "Modern open-source diagramming for macOS, built for system design"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
gif = "0.13"
resvg = "0.45"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaml-rust2 = "0.10"

# Files opened from Finder arrive as an AppKit event (versions match what winit 0.30 already uses)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
block2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSNotification", "NSOperation", "NSString", "NSURL", "NSObject", "block2"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder"] }
