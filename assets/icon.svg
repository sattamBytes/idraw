<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- wires -->
  <g stroke="#94a3b8" stroke-opacity="0.7" stroke-width="22" stroke-linecap="round">
    <path d="M345 355 L679 355"/>
    <path d="M345 355 L512 690"/>
    <path d="M679 355 L512 690"/>
  </g>
  <!-- glowing shape-nodes -->
  <g filter="url(#glow)">
    <circle cx="345" cy="355" r="96" fill="#818cf8"/>
    <rect x="587" y="263" width="184" height="184" rx="40" fill="#fb7185"/>
    <path d="M512 582 L618 766 L406 766 Z" fill="#fcd34d" stroke="#fcd34d" stroke-width="24" stroke-linejoin="round"/>
  </g>
</svg>
