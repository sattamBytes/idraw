name: Release
# Builds the universal idraw.app zip and attaches it to a published GitHub release
# (skips if the release already has the zip, e.g. one uploaded by hand).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.2.0)
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Skip if already attached
        id: check
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q 'macos-universal.zip'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build universal app
        if: steps.check.outputs.skip != 'true'
        run: scripts/bundle.sh --universal
      - name: Upload
        if: steps.check.outputs.skip != 'true'
        run: |
          gh release upload "$TAG" dist/*-macos-universal.zip
          shasum -a 256 dist/*-macos-universal.zip
